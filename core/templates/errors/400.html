<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        400 - Bad request
    </title>

    <style>

        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --soft-blue: #eff6ff;
            --orange: #f97316;
            --text: #172033;
            --muted: #64748b;
            --border: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #ffffff
                );
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .error-card {
            width: min(620px, 100%);
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px 34px;
            text-align: center;
            box-shadow:
                0 18px 50px
                rgba(37, 99, 235, 0.10);
        }

        .code {
            margin: 0;
            color: var(--blue);
            font-size: clamp(4rem, 14vw, 7rem);
            line-height: 1;
            font-weight: 800;
        }

        h1 {
            margin:
                18px 0
                10px;
            font-size: 1.8rem;
        }

        p {
            max-width: 470px;
            margin:
                0 auto
                26px;
            color: var(--muted);
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }

        .primary {
            background: var(--blue);
            color: white;
        }

        .primary:hover {
            background: var(--blue-dark);
        }

        .secondary {
            background: var(--soft-blue);
            color: var(--blue-dark);
        }

        .accent {
            width: 50px;
            height: 5px;
            margin: 0 auto 24px;
            border-radius: 99px;
            background: var(--orange);
        }

    </style>

</head>

<body>

    <main
        class="error-card"
        role="main"
    >

        <div class="accent"></div>

        <p class="code">
            400
        </p>

        <h1>
            Bad request
        </h1>

        <p>
            We could not process that request. Please check the information submitted and try again.
        </p>

        <div class="actions">

            <a
                class="primary"
                href="/"
            >
                Go to homepage
            </a>

            <a
                class="secondary"
                href="/shop/"
            >
                Continue shopping
            </a>

        </div>

    </main>

</body>

</html>
