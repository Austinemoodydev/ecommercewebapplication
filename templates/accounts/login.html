{% extends "base.html" %}
{% load socialaccount %}
{% block content %}
<div class="container py-5" style="max-width: 400px;">
  <h2 class="mb-4">Login</h2>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-warning w-100">Login</button></form>
  <div class="text-center text-muted my-3">or continue with</div>
  <div class="d-grid gap-2">
    <a class="btn btn-outline-danger" href="{% provider_login_url 'google' %}">Continue with Google</a>
    <a class="btn btn-outline-primary" href="{% provider_login_url 'facebook' %}">Continue with Facebook</a>
    <a class="btn btn-outline-dark" href="{% provider_login_url 'apple' %}">Continue with Apple</a>
  </div>
</div>
{% endblock %}
