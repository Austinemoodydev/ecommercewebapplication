{% extends "base.html" %}
{% block title %}My profile{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 700px;">
    <h1>My profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save profile</button>
    </form>
</div>
{% endblock %}
